<script>
window.notesStorageKey='mazo-notas-publicas-v1';
(()=>{'use strict';const KEY=()=>window.notesStorageKey||'mazo-notas-v2-sin-cuenta',colors=['#f5f1e9','#e3c896','#fff3bd','#fbd5d5','#d9f1dc','#d6e8ff','#eadcff','#ffe4cb','#d8f3f1'];const $=id=>document.getElementById(id);const GRID_X=270,GRID_Y=220,BASE_X=20,BASE_Y=80;const snapX=x=>BASE_X+Math.max(0,Math.round((x-BASE_X)/GRID_X))*GRID_X,snapY=y=>BASE_Y+Math.max(0,Math.round((y-BASE_Y)/GRID_Y))*GRID_Y;let notes=[],maxZ=1,pending=null,drag=null,suppressClick=false,saveTimer=null,cloudWriteTimer=null,queuedRemote=null;

notes.forEach((n,i)=>{if(!Number.isFinite(n.x))n.x=24+(i%4)*272;if(!Number.isFinite(n.y))n.y=100+Math.floor(i/4)*235;if(!Number.isFinite(n.z))n.z=i+1;n.x=snapX(n.x);n.y=snapY(n.y);maxZ=Math.max(maxZ,n.z)});
function occupied(x,y,except){return notes.some(n=>n.id!==except&&n.x===x&&n.y===y)}
function freeSlot(x,y,except){x=snapX(x);y=snapY(y);if(!occupied(x,y,except))return {x,y};for(let radius=1;radius<1000;radius++){for(let dy=0;dy<=radius;dy++){for(let dx=0;dx<=radius;dx++){if(Math.max(dx,dy)!==radius)continue;for(const [cx,cy] of [[x+dx*GRID_X,y+dy*GRID_Y],[x-dx*GRID_X,y+dy*GRID_Y],[x+dx*GRID_X,y-dy*GRID_Y],[x-dx*GRID_X,y-dy*GRID_Y]]){if(cx>=BASE_X&&cy>=BASE_Y&&!occupied(cx,cy,except))return {x:cx,y:cy}}}}}return {x,y}}
// Recolocar notas antiguas que compartieran una misma casilla.
const placed=new Set();notes.forEach(n=>{let x=n.x,y=n.y;while(placed.has(`${x},${y}`)){x+=GRID_X}n.x=x;n.y=y;placed.add(`${x},${y}`)});

 try{localStorage.setItem(KEY(),JSON.stringify(notes))}catch(e){}

}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(persist,180)}
function get(id){return notes.find(n=>n.id===id)}
const GAP=20;

 for(const n of notes){const col=columnOf(n);if(!cols.has(col))cols.set(col,[]);cols.get(col).push(n)}

}
function resizeBoard(){
 const moving=drag?get(drag.id):null;const pos=moving?{x:moving.x,y:moving.y}:null;

   if(!el.classList.contains('dragging')){el.style.left=n.x+'px';el.style.top=top+'px';}
   const height=Math.max(200,el.offsetHeight);
   if(!el.classList.contains('dragging'))top+=height+GAP;
   w=Math.max(w,el.offsetLeft+el.offsetWidth+GAP);h=Math.max(h,el.offsetTop+el.offsetHeight+GAP);
  }

 $('board').style.width=w+'px';$('board').style.height=h+'px';
}
function insertionRow(col,y,exclude){
 const others=notes.filter(n=>n.id!==exclude&&columnOf(n)===col).sort((a,b)=>a.y-b.y);
 let top=BASE_Y;
 for(let i=0;i<others.length;i++){
  const el=document.querySelector(`.note[data-id="${CSS.escape(others[i].id)}"]`);
  const height=el?Math.max(200,el.offsetHeight):200;
  if(y<top+height/2)return i;
  top+=height+GAP;

}
function makeNote(n){const el=document.createElement('article');el.className='note';el.dataset.id=n.id;el.style.cssText=`left:${n.x}px;top:${n.y}px;z-index:${n.z};--note-color:${colors.includes(n.color)?n.color:'#f5f1e9'}`;
const title=document.createElement('div');title.className='note-title';title.contentEditable='true';title.dataset.placeholder='Título';title.setAttribute('role','textbox');title.setAttribute('aria-label','Título');title.textContent=n.title||'';
const body=document.createElement('div');body.className='note-body';body.setAttribute('aria-label','Tareas');
if(!Array.isArray(n.tasks))n.tasks=(n.body||'').split(/\r?\n/).filter(t=>t.trim().length).map(t=>({id:globalThis.crypto?.randomUUID?.()||String(Math.random()),text:t}));if(!n.tasks.length)n.tasks=[{id:globalThis.crypto?.randomUUID?.()||String(Math.random()),text:''}];
function syncTasks(){n.body=n.tasks.map(t=>t.text).join('\n');scheduleSave();resizeBoard()}
function addTask(text=''){const t={id:globalThis.crypto?.randomUUID?.()||String(Date.now()+Math.random()),text,done:false};n.tasks.push(t);renderTasks();syncTasks();const inp=[...body.querySelectorAll('.task-text')].at(-1);inp?.focus()}
function renderTasks(){body.replaceChildren();n.tasks.forEach((t,index)=>{
 const row=document.createElement('div');row.className='task';row.dataset.taskId=t.id;
 const inp=document.createElement('textarea');inp.className='task-text';inp.rows=1;inp.value=t.text;inp.placeholder='';inp.setAttribute('aria-label','Tarea');
 function autosize(){inp.style.height='20px';inp.style.height=Math.max(20,inp.scrollHeight)+'px';resizeBoard()}
 inp.addEventListener('input',()=>{t.text=inp.value.replace(/\n/g,'');syncTasks();autosize()});
 inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();addTask()}else if(e.key==='Backspace'&&!inp.value&&n.tasks.length>1){e.preventDefault();n.tasks.splice(n.tasks.indexOf(t),1);renderTasks();syncTasks();const prev=body.querySelectorAll('.task-text')[Math.max(0,index-1)];prev?.focus()}});
 const delTask=document.createElement('button');delTask.type='button';delTask.className='task-delete';delTask.textContent='×';delTask.title='Eliminar tarea';delTask.onclick=()=>{n.tasks=n.tasks.filter(x=>x.id!==t.id);renderTasks();syncTasks()};
 // A click edits the text; moving the pointer reorders the complete task.
 let taskPending=null,taskMoving=false,originalOrder=null;
 row.addEventListener('pointerdown',e=>{
  if(e.button!==0||e.target.closest('button'))return;
  taskPending={pid:e.pointerId,x:e.clientX,y:e.clientY};
 });
 function moveTask(e){
  if(!taskPending||e.pointerId!==taskPending.pid)return;
  if(!taskMoving){
   if(Math.hypot(e.clientX-taskPending.x,e.clientY-taskPending.y)<6)return;
   originalOrder=[...n.tasks];taskMoving=true;
   row.classList.add('dragging','task-dragging');
   row.setPointerCapture(e.pointerId);inp.blur();window.getSelection()?.removeAllRanges();
  }
  e.preventDefault();
  const siblings=[...body.querySelectorAll('.task')].filter(x=>x!==row);
  const before=siblings.find(x=>{const r=x.getBoundingClientRect();return e.clientY<r.top+r.height/2});
  body.insertBefore(row,before||null);resizeBoard();
 }
 function endTask(e){
  if(!taskPending||e.pointerId!==taskPending.pid)return;
  const moved=taskMoving;taskPending=null;taskMoving=false;
  if(!moved)return;
  if(e.type==='pointercancel'){
   for(const task of originalOrder)body.append([...body.children].find(x=>x.dataset.taskId===task.id));
  }else{
   const byId=new Map(n.tasks.map(x=>[x.id,x]));
   n.tasks=[...body.querySelectorAll('.task')].map(x=>byId.get(x.dataset.taskId));
  }
  row.classList.remove('dragging','task-dragging');
  if(row.hasPointerCapture(e.pointerId))row.releasePointerCapture(e.pointerId);
  suppressClick=true;setTimeout(()=>suppressClick=false,0);syncTasks();persist();
 }
 row.addEventListener('pointermove',moveTask);
 row.addEventListener('pointerup',endTask);
 row.addEventListener('pointercancel',endTask);
 row.append(inp,delTask);row.addEventListener('click',e=>{if(e.target===row)inp.focus()});body.append(row);requestAnimationFrame(autosize);
 });}

renderTasks();
body.addEventListener('click',e=>{if(e.target!==body)return;const last=body.querySelector('.task-text:last-of-type')||body.querySelector('.task:last-child .task-text');if(last&&!last.value.trim())last.focus();else addTask()});
const actions=document.createElement('div');actions.className='note-actions';const swatches=document.createElement('div');swatches.className='swatches';colors.forEach(c=>{const b=document.createElement('button');b.type='button';b.style.background=c;b.title='Cambiar color';b.setAttribute('aria-label','Cambiar color');b.onclick=()=>{n.color=c;el.style.setProperty('--note-color',c);persist()};swatches.append(b)});
const colorBtn=document.createElement('button');colorBtn.textContent='◉';colorBtn.title='Color';colorBtn.setAttribute('aria-label','Elegir color');colorBtn.onclick=()=>swatches.classList.toggle('open');const del=document.createElement('button');del.textContent='🗑';del.title='Eliminar';del.setAttribute('aria-label','Eliminar nota');del.onclick=()=>{if(confirm('¿Eliminar esta nota?')){notes=notes.filter(x=>x.id!==n.id);el.remove();persist();showEmpty();resizeBoard()}};
actions.append(swatches,colorBtn,del);el.append(title,body,actions);for(const [field,box] of [['title',title]]){box.addEventListener('input',()=>{n[field]=box.innerText;scheduleSave();resizeBoard()});box.addEventListener('blur',persist)};return el}
function showEmpty(){document.querySelector('.empty')?.remove();if(!notes.length){const el=document.createElement('div');el.className='empty';el.textContent='Pulsa «＋ Nueva nota» para empezar';$('content').append(el)}}
function render(){const c=$('content');c.replaceChildren(...notes.map(makeNote));showEmpty();resizeBoard()}
$('create').onclick=()=>{const counts=new Map();for(const n of notes)counts.set(columnOf(n),(counts.get(columnOf(n))||0)+1);const columns=Math.max(1,Math.floor((innerWidth-BASE_X-GAP)/GRID_X));let col=0;for(let c=1;c<columns;c++)if((counts.get(c)||0)<(counts.get(col)||0))col=c;const n={id:globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random(),title:'',body:'',color:'#f5f1e9',x:BASE_X+col*GRID_X,y:BASE_Y+(counts.get(col)||0)*GRID_Y,z:++maxZ};notes.push(n);const el=makeNote(n);$('content').append(el);showEmpty();resizeBoard();persist();el.querySelector('.note-title').focus()};
function cancelPending(){pending=null}
$('content').addEventListener('pointerdown',e=>{if(e.button!==0||!e.target.closest('.note-title'))return;const el=e.target.closest('.note');if(!el)return;const n=get(el.dataset.id);if(!n)return;pending={id:n.id,el,pid:e.pointerId,startX:e.clientX,startY:e.clientY,x:n.x,y:el.offsetTop};});
$('content').addEventListener('pointermove',e=>{if(pending&&e.pointerId===pending.pid&&Math.hypot(e.clientX-pending.startX,e.clientY-pending.startY)>3){drag=pending;pending=null;const n=get(drag.id);n.z=++maxZ;drag.el.style.zIndex=n.z;drag.el.classList.add('dragging');drag.el.setPointerCapture(drag.pid);window.getSelection()?.removeAllRanges();document.activeElement?.blur?.()}if(!drag||e.pointerId!==drag.pid)return;const n=get(drag.id);if(!n)return;n.x=Math.max(0,Math.round(drag.x+e.clientX-drag.startX));n.y=Math.max(0,Math.round(drag.y+e.clientY-drag.startY));drag.el.style.left=n.x+'px';drag.el.style.top=n.y+'px';resizeBoard();e.preventDefault()});
function finish(e){if(pending&&e.pointerId===pending.pid)cancelPending();if(!drag||e.pointerId!==drag.pid)return;const n=get(drag.id);if(n){const col=Math.max(0,Math.round((n.x-BASE_X)/GRID_X));const row=insertionRow(col,n.y,n.id);const others=notes.filter(item=>item.id!==n.id&&columnOf(item)===col).sort((a,b)=>a.y-b.y);others.forEach((item,i)=>item.y=BASE_Y+(i>=row?i+1:i)*GRID_Y);n.x=BASE_X+col*GRID_X;n.y=BASE_Y+row*GRID_Y;}drag.el.classList.remove('dragging');if(drag.el.hasPointerCapture(e.pointerId))drag.el.releasePointerCapture(e.pointerId);drag=null;resizeBoard();suppressClick=true;setTimeout(()=>suppressClick=false,0);persist()}
window.addEventListener('pointerup',finish);window.addEventListener('pointercancel',finish);$('content').addEventListener('click',e=>{if(suppressClick){e.preventDefault();e.stopPropagation()}},true);window.addEventListener('resize',resizeBoard);render();
 window.getCurrentNotes=()=>notes;
 window.replaceNotes=arr=>{notes=JSON.parse(JSON.stringify(arr));maxZ=Math.max(1,...notes.map(n=>n.z||1));render();try{localStorage.setItem(KEY(),JSON.stringify(notes))}catch(e){}};
 window.saveNotesToCloud=()=>persist();
 window.addEventListener('pagehide',()=>{try{localStorage.setItem(KEY(),JSON.stringify(notes))}catch(e){}});
})();


// Public shared board. No Google session or account is required.
const API='https://krgqalymfdyffylczwfx.supabase.co/rest/v1/rpc/';
const PUBLIC_KEY='sb_publishable_gOMmTT95St3iF5BSGdKijg_cZ4S9wcT';
const CACHE='mazo-notas-publicas-sync-v1';
const status=document.getElementById('account');
let base=[],pending=null,busy=false,ready=false,timer;
const copy=x=>JSON.parse(JSON.stringify(x));
function stable(x){
 if(Array.isArray(x))return '['+x.map(stable).join(',')+']';
 if(x&&typeof x==='object')return '{'+Object.keys(x).sort().map(k=>JSON.stringify(k)+':'+stable(x[k])).join(',')+'}';
 return JSON.stringify(x);
}
const same=(a,b)=>stable(a)===stable(b);
const current=()=>copy(window.getCurrentNotes());
const uid=()=>crypto.randomUUID();
function diff(before,after){
 const a=new Map(before.map(n=>[n.id,n])),b=new Map(after.map(n=>[n.id,n])),ops=[];
 for(const id of new Set([...a.keys(),...b.keys()])){
  const old=a.get(id),next=b.get(id);
  if(same(old,next))continue;
  if(!next){ops.push({id,kind:'delete'});continue}
  if(!old){ops.push({id,kind:'create',note:copy(next)});continue}
  const changes={};
  for(const key of Object.keys(next))if(key!=='id'&&!same(old[key],next[key]))changes[key]=copy(next[key]);
  if(Object.keys(changes).length)ops.push({id,kind:'patch',changes});
 }
 return ops;
}
function apply(state,ops){
 const map=new Map(state.map(n=>[n.id,copy(n)]));
 for(const op of ops){
  if(op.kind==='delete')map.delete(op.id);
  else if(op.kind==='create')map.set(op.id,copy(op.note));
  else if(op.kind==='patch'&&map.has(op.id))map.set(op.id,{...map.get(op.id),...copy(op.changes)});
 }
 return [...map.values()];
}
function validNotes(arr){
 if(!Array.isArray(arr)||arr.length>5000)throw Error('El archivo no contiene una lista de notas válida');
 const ids=new Set();
 return arr.map((n,i)=>{
  if(!n||typeof n.id!=='string'||n.id.length>200||ids.has(n.id))throw Error('El archivo contiene notas inválidas o IDs repetidos');
  ids.add(n.id);
  if(n.tasks!==undefined&&(!Array.isArray(n.tasks)||n.tasks.some(t=>!t||typeof t.id!=='string'||typeof t.text!=='string')))throw Error('Tareas inválidas');
  return {id:n.id,title:String(n.title||''),body:String(n.body||''),color:String(n.color||'#f5f1e9'),
   x:Number.isFinite(n.x)?n.x:20,y:Number.isFinite(n.y)?n.y:80+i*220,z:Number.isFinite(n.z)?n.z:i+1,
   ...(n.tasks?{tasks:copy(n.tasks)}:{})};
 });
}
function applyUI(notes){
 const active=document.activeElement, noteId=active?.closest('.note')?.dataset.id,
 taskId=active?.closest('.task')?.dataset.taskId, title=active?.matches('.note-title'),
 start=active?.selectionStart,end=active?.selectionEnd,sel=window.getSelection(),offset=title?sel?.focusOffset:null;
 window.replaceNotes(notes);
 if(noteId){
  const note=document.querySelector('.note[data-id="'+CSS.escape(noteId)+'"]');
  const el=title?note?.querySelector('.note-title'):note?.querySelector('.task[data-task-id="'+CSS.escape(taskId||'')+'"] .task-text');
  el?.focus();if(el&&start!=null)el.setSelectionRange(start,end);
  if(title&&el?.firstChild&&offset!=null){const range=document.createRange();range.setStart(el.firstChild,Math.min(offset,el.firstChild.textContent.length));range.collapse(true);sel.removeAllRanges();sel.addRange(range)}
 }
}

function showStatus(text){status.textContent=text}
function cache(){
 try{localStorage.setItem(CACHE,JSON.stringify({base,notes:current(),pending}))}
 catch(e){showStatus('No se puede guardar la copia local')}
}
async function request(method,body={}){
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),15000);
 try{
  const r=await fetch(API+method,{method:'POST',headers:{apikey:PUBLIC_KEY,'Content-Type':'application/json'},body:JSON.stringify(body),signal:controller.signal});
  if(!r.ok){
   let detail={};try{detail=await r.json()}catch(_){}
   const code=typeof detail.code==='string'?detail.code:'';
   const message=typeof detail.message==='string'?detail.message:'La petición fue rechazada';
   const e=Error('HTTP '+r.status+(code?' · '+code:'')+' · '+message);
   e.httpStatus=r.status;e.rpc=method;throw e;
  }
  return await r.json();
 }finally{clearTimeout(timeout)}
}
function changed(){return !same(base,current())}
window.queueCloudSave=()=>{
 cache();showStatus('Cambios pendientes…');clearTimeout(timer);timer=setTimeout(sync,650);
};
async function sync(){
 if(busy||document.querySelector('.dragging'))return;
 busy=true;
 try{
  // Retry exactly the same mutation after an interrupted upload.
  if(!pending&&changed())pending={id:uid(),sent:current(),ops:diff(base,current())};
  cache();
  if(pending){
   showStatus('Guardando…');
   const result=validNotes(await request('mazo_notes_apply',{mutation_id:pending.id,operations:pending.ops}));
   const later=diff(pending.sent,current());
   base=copy(result);pending=null;
   const merged=apply(result,later);
   if(!same(current(),merged)&&!document.querySelector('.dragging'))applyUI(merged);
   ready=true;cache();
  }else{
   const result=validNotes(await request('mazo_notes_read'));
   // Preserve edits made while the request was in flight.
   if(document.querySelector('.dragging'))return;
   const edits=diff(base,current());
   const merged=apply(result,edits);
   base=copy(result);
   if(!same(current(),merged)&&!document.querySelector('.dragging'))applyUI(merged);
   ready=true;cache();
  }
  showStatus(changed()?'Cambios pendientes…':'Guardado · sincronización automática');
 }catch(e){
  let reason;
  if(e.httpStatus)reason=e.message;
  else if(e.name==='AbortError')reason='Supabase no respondió en 15 segundos';
  else if(e instanceof TypeError)reason='No se pudo conectar con Supabase (red, bloqueo del navegador o dirección del proyecto)';
  else reason=e.message||'Error desconocido';
  const prefix=pending||changed()?'Pendiente de subir · ':'No se pudo actualizar · ';
  showStatus(prefix+reason+' · copia en este navegador');
  status.title=reason;
 }
 finally{busy=false;clearTimeout(timer);timer=setTimeout(sync,changed()||pending?2000:5000)}
}
try{
 const saved=JSON.parse(localStorage.getItem(CACHE)||'null');
 if(saved){base=validNotes(saved.base);pending=saved.pending||null;window.replaceNotes(validNotes(saved.notes))}
}catch(e){showStatus('No se pudo recuperar la copia local')}

window.addEventListener('focus',sync);
