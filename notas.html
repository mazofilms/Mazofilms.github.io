function resizeBoard(){

  }

function insertionRow(col,y,exclude){

  const el=document.querySelector(`.note[data-id="${CSS.escape(others[i].id)}"]`);

actions.append(swatches,colorBtn,del);el.append(title,body,actions);for(const [field,box] of [['title',title]]){box.addEventListener('input',()=>{n[field]=box.innerText;scheduleSave();resizeBoard()});box.addEventListener('blur',persist)};return el}

$('create').onclick=()=>{const counts=new Map();for(const n of notes)counts.set(columnOf(n),(counts.get(columnOf(n))||0)+1);const columns=Math.max(1,Math.floor((innerWidth-BASE_X-GAP)/GRID_X));let col=0;for(let c=1;c<columns;c++)if((counts.get(c)||0)<(counts.get(col)||0))col=c;const n={id:globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random(),title:'',body:'',color:'#f5f1e9',x:BASE_X+col*GRID_X,y:BASE_Y+(counts.get(col)||0)*GRID_Y,z:++maxZ};notes.push(n);const el=makeNote(n);$('content').append(el);showEmpty();resizeBoard();persist();el.querySelector('.note-title').focus()};

const CLIENT_ID='46555881295-sdavk9j772g54hfae9kcmrmahig9gcgu.apps.googleusercontent.com';

function forgetSession(){try{sessionStorage.removeItem(SESSION)}catch(e){}}
function readSession(){
 try{const saved=JSON.parse(sessionStorage.getItem(SESSION)||'null');
 if(saved&&typeof saved.access_token==='string'&&saved.client===CLIENT_ID&&Number(saved.expires)>Date.now()&&saved.scope?.split(' ').includes(SCOPE))return saved;
 }catch(e){}

}
function rememberSession(scope){try{sessionStorage.setItem(SESSION,JSON.stringify({client:CLIENT_ID,access_token:token,expires,scope}))}catch(e){}}
let client=null,token='',expires=0,userId='',folderId='',busy=false,ready=false,saveTimer=null;

function stable(x){
 if(Array.isArray(x))return '['+x.map(stable).join(',')+']';
 if(x&&typeof x==='object')return '{'+Object.keys(x).sort().map(k=>JSON.stringify(k)+':'+stable(x[k])).join(',')+'}';

}
const same=(a,b)=>stable(a)===stable(b);

function diff(before,after){
 const a=new Map(before.map(n=>[n.id,n])),b=new Map(after.map(n=>[n.id,n])),ops=[];
 for(const id of new Set([...a.keys(),...b.keys()])){
  const old=a.get(id),next=b.get(id);
  if(same(old,next))continue;
  if(!next){ops.push({id,kind:'delete'});continue}
  if(!old){ops.push({id,kind:'create',note:copy(next)});continue}
  const changes={};
  for(const key of Object.keys(next))if(key!=='id'&&!same(old[key],next[key]))changes[key]=copy(next[key]);
  if(Object.keys(changes).length)ops.push({id,kind:'patch',changes});
 }
 return ops;
}
function apply(state,ops){
 const map=new Map(state.map(n=>[n.id,copy(n)]));
 for(const op of ops){
  if(op.kind==='delete')map.delete(op.id);
  else if(op.kind==='create')map.set(op.id,copy(op.note));
  else if(op.kind==='patch'&&map.has(op.id))map.set(op.id,{...map.get(op.id),...copy(op.changes)});
 }
 return [...map.values()];
}
function reduceEvents(items){
 let state=[];const seen=new Set();
 for(const item of [...items].sort((a,b)=>a.time.localeCompare(b.time)||a.id.localeCompare(b.id))){
  if(!item.data||item.data.schema!==1||seen.has(item.data.mutation))continue;
  seen.add(item.data.mutation);state=apply(state,item.data.ops);
 }
 return state;
}
function validNotes(arr){

  if(!n||typeof n.id!=='string'||n.id.length>200||ids.has(n.id))throw Error('El archivo contiene notas inválidas o IDs repetidos');
  ids.add(n.id);
  if(n.tasks!==undefined&&(!Array.isArray(n.tasks)||n.tasks.some(t=>!t||typeof t.id!=='string'||typeof t.text!=='string')))throw Error('Tareas inválidas');
  return {id:n.id,title:String(n.title||''),body:String(n.body||''),color:String(n.color||'#f5f1e9'),
   x:Number.isFinite(n.x)?n.x:20,y:Number.isFinite(n.y)?n.y:80+i*220,z:Number.isFinite(n.z)?n.z:i+1,

function requireConnection(){

}
async function request(path,options={}){
 requireConnection();
 const controller=new AbortController(), timeout=setTimeout(()=>controller.abort(),20000);
 try{
  const response=await fetch(path.startsWith('https://')?path:API+path,{...options,signal:controller.signal,headers:{Authorization:'Bearer '+token,...options.headers}});
  if(!response.ok){
   let message='Error de Google Drive ('+response.status+')';
   try{message=(await response.json()).error?.message||message}catch(e){}
   const error=Error(message);error.status=response.status;
   if(response.status===401){token='';forgetSession();showStatus('Sesión caducada · pulsa aquí para conectar')}
   throw error;
  }
  return response.status===204?{}:response.json();
 }finally{clearTimeout(timeout)}
}
async function list(kind){

  const params=new URLSearchParams({q:"trashed = false and appProperties has { key='app' and value='"+APP+"' } and appProperties has { key='kind' and value='"+kind+"' }",fields:'nextPageToken,files(id,createdTime,name)',pageSize:'1000'});
  if(page)params.set('pageToken',page);
  const result=await request('/files?'+params);all.push(...(result.files||[]));page=result.nextPageToken||'';
 }while(page);
 return all;
}
async function ensureFolder(){
 const folders=await list('folder');
 if(folders.length){folderId=folders.sort((a,b)=>a.createdTime.localeCompare(b.createdTime))[0].id;return}
 const file=await request('/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'Mis notas · MAZO',mimeType:'application/vnd.google-apps.folder',appProperties:{app:APP,kind:'folder'}})});
 folderId=file.id;
}
async function refresh(){
 const files=await list('event');
 for(let i=0;i<files.length;i+=4){
  await Promise.all(files.slice(i,i+4).filter(f=>!events.has(f.id)).map(async f=>{
   const data=await request('/files/'+encodeURIComponent(f.id)+'?alt=media');
   if(data.schema!==1||!Array.isArray(data.ops))throw Error('Archivo de sincronización inválido');
   events.set(f.id,{id:f.id,time:f.createdTime,data});
  }));
 }
 // Files moved to Trash no longer participate.
 const ids=new Set(files.map(f=>f.id));for(const id of events.keys())if(!ids.has(id))events.delete(id);
 remote=reduceEvents(events.values());
}
async function uploadPending(){
 if(!pending.fileId){
  const ids=await request('/files/generateIds?count=1&space=drive&type=files');
  pending.fileId=ids.ids[0];cache();
 }
 const boundary='mazo_'+uid().replaceAll('-','');
 const meta={id:pending.fileId,name:'cambio-'+pending.event.mutation+'.json',mimeType:'application/json',parents:[folderId],appProperties:{app:APP,kind:'event'}};
 const body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify(pending.event)+'\r\n--'+boundary+'--';
 let file;
 try{file=await request('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,createdTime',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body})}
 catch(e){
  if(e.status!==409)throw e;
  file=await request('/files/'+encodeURIComponent(pending.fileId)+'?fields=id,createdTime');
 }
 events.set(file.id,{id:file.id,time:file.createdTime,data:pending.event});
 remote=reduceEvents(events.values());
 // Changes made while uploading stay pending for the next save.
 const live=current(), later=diff(pending.sent,live);
 base=copy(remote);pending=null;cache();
 const merged=apply(remote,later);
 if(!same(merged,live))applyUI(merged);cache();
}
window.queueDriveSave=()=>{
 if(!userId)return;
 cache();showStatus(token?'Cambios pendientes…':'Copia local · conecta Drive para guardar');
 clearTimeout(saveTimer);saveTimer=setTimeout(sync,1400);
};
async function sync(){
 if(busy||!ready||!token||document.querySelector('.dragging'))return;
 busy=true;
 try{
  requireConnection();
  if(!pending){
   const ops=diff(base,current());
   if(ops.length){
    pending={sent:current(),event:{schema:1,mutation:uid(),ops}};cache();
   }
  }
  if(pending){
   showStatus('Guardando en Drive…');await uploadPending();
  }else if(!document.activeElement?.matches('.task-text,.note-title')){
   const before=current();await refresh();
   const later=diff(base,current());base=copy(remote);
   const merged=apply(remote,later);
   if(!same(current(),merged)&&!document.querySelector('.dragging'))applyUI(merged);cache();
  }
  showStatus('Guardado en Drive');
 }catch(e){
  showStatus(token?'No se pudo guardar · se reintentará':'Copia local · pulsa aquí para conectar');
  console.warn(e.message);
 }finally{
  busy=false;
  if(token&&(pending||diff(base,current()).length)){clearTimeout(saveTimer);saveTimer=setTimeout(sync,5000)}
 }
}
async function authorize(response){
 if(response.error){document.getElementById('autherror').textContent='Google no autorizó el acceso';return}
 if(!google.accounts.oauth2.hasGrantedAllScopes(response,SCOPE)){document.getElementById('autherror').textContent='Debes autorizar el acceso a los archivos de la web';return}
 token=response.access_token;expires=response.cachedExpires||Date.now()+Math.max(0,Number(response.expires_in||3600)-60)*1000;
 if(busy)return;
 busy=true;
 try{
  const result=await request('/about?fields=user(permissionId,emailAddress)');
  const account=result.user.permissionId;
  if(!account)throw Error('No se pudo identificar tu cuenta de Drive');
  if(account!==userId){
   cache();userId=account;ready=false;events=new Map();remote=[];folderId='';
   window.notesStorageKey='mazo-notas-drive-v2-'+account;
   const saved=JSON.parse(localStorage.getItem(notesStorageKey)||'[]');
   base=JSON.parse(localStorage.getItem(keys().base)||'[]');
   pending=JSON.parse(localStorage.getItem(keys().pending)||'null');
   applyUI(validNotes(saved));
  }
  showStatus('Conectando con Drive…');await ensureFolder();await refresh();
  // Recover an upload interrupted before its acknowledgement.
  if(pending)await uploadPending();
  const edits=diff(base,current());base=copy(remote);applyUI(apply(remote,edits));cache();
  ready=true;screen.hidden=true;rememberSession(response.scope||SCOPE);
  document.getElementById('logout').hidden=false;
  showStatus('Guardado en Drive');
 }catch(e){showStatus('No se pudo conectar');document.getElementById('autherror').textContent=e.message}
 finally{busy=false;if(ready&&(pending||diff(base,current()).length))window.queueDriveSave()}
}
window.gisLoaded=()=>{
 client=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,include_granted_scopes:false,callback:authorize,error_callback:e=>{document.getElementById('autherror').textContent=e.type==='popup_closed'?'Se ha cerrado el acceso a Google':'Permite las ventanas emergentes para conectar';}});
 login.disabled=false;document.getElementById('autherror').textContent='';
 const saved=readSession();
 if(saved){document.getElementById('autherror').textContent='Recuperando tu sesión…';authorize({access_token:saved.access_token,scope:saved.scope,cachedExpires:saved.expires});}
};
function connectDrive(){if(busy)return;client?.requestAccessToken({prompt:userId?'':'select_account'})}
login.onclick=connectDrive;
status.onclick=()=>{if(!token){screen.hidden=false;document.getElementById('autherror').textContent='Conecta Google para continuar guardando en Drive';}};
document.getElementById('logout').onclick=()=>{
 if(busy){alert('Espera a que termine el guardado');return}
 if((pending||diff(base,current()).length)&&!confirm('Quedan cambios sin guardar en Drive. Se conservarán localmente para esta cuenta. ¿Salir?'))return;
 cache();forgetSession();token='';expires=0;ready=false;userId='';events=new Map();remote=[];base=[];pending=null;
 window.notesStorageKey='mazo-notas-v2-sin-cuenta';applyUI([]);screen.hidden=false;
 document.getElementById('logout').hidden=true;
 showStatus('Sin conectar');
};
window.addEventListener('online',sync);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync();else cache()});
window.addEventListener('pagehide',cache);
setInterval(()=>{if(!document.hidden)sync()},10000);

</script><script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()" onerror="document.getElementById('autherror').textContent='No se pudo cargar Google. Comprueba la conexión o el bloqueador.'"></script></body></html>
